<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-labelledby="title desc">
  <title id="title">messenger edge tool line-free portfolio visual</title>
  <desc id="desc">English ASCII-safe SVG visual for messenger-edge-tool without moving connector lines.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="55%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <style>
      .title { font: 800 34px Segoe UI, Arial, sans-serif; fill: #f8fafc; letter-spacing: 0; }
      .subtitle { font: 650 19px Segoe UI, Arial, sans-serif; fill: #dbeafe; letter-spacing: 0; }
      .chipText { font: 800 15px Segoe UI, Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .caption { font: 700 16px Segoe UI, Arial, sans-serif; fill: #e2e8f0; letter-spacing: 0; }
      .panel { fill: rgba(15,23,42,.54); stroke: rgba(255,255,255,.20); stroke-width: 1.2; }
      .pulse { animation: pulse 3.4s ease-in-out infinite; transform-origin: center; }
      .soft { animation: soft 4.8s ease-in-out infinite; transform-origin: center; }
      @keyframes pulse { 0%, 100% { opacity: .78; transform: scale(.99); } 50% { opacity: 1; transform: scale(1.02); } }
      @keyframes soft { 0%, 100% { opacity: .68; } 50% { opacity: 1; } }
    </style>
  </defs>
  <rect width="1100" height="300" rx="26" fill="url(#bg)" />
  <rect x="38" y="34" width="1024" height="232" rx="22" class="panel" />
  <text x="72" y="66" class="title">messenger edge tool</text>
  <text x="72" y="96" class="subtitle">Python/Tkinter desktop tool using Microsoft Edge and Playwright for</text>
  <text x="72" y="124" class="subtitle">local context extraction and human-controlled AI draft support.</text>
  <g>
    <g class="pulse"><rect x="61" y="218" width="181" height="48" rx="16" fill="#e0f2fe" /><text x="151.5" y="248" text-anchor="middle" class="chipText">automation</text></g>
    <g class="pulse"><rect x="260" y="218" width="181" height="48" rx="16" fill="#dcfce7" /><text x="350.5" y="248" text-anchor="middle" class="chipText">microsoft edge</text></g>
    <g class="pulse"><rect x="459" y="218" width="181" height="48" rx="16" fill="#fef9c3" /><text x="549.5" y="248" text-anchor="middle" class="chipText">playwright</text></g>
    <g class="pulse"><rect x="658" y="218" width="181" height="48" rx="16" fill="#fee2e2" /><text x="748.5" y="248" text-anchor="middle" class="chipText">python</text></g>
    <g class="pulse"><rect x="857" y="218" width="181" height="48" rx="16" fill="#dbeafe" /><text x="947.5" y="248" text-anchor="middle" class="chipText">tkinter</text></g>
  </g>
  <rect x="72" y="244" width="956" height="28" rx="14" fill="rgba(15,23,42,.58)" />
  <text x="550.0" y="263" text-anchor="middle" class="caption">English visual asset - no connector lines - release-backed portfolio evidence</text>
</svg>
